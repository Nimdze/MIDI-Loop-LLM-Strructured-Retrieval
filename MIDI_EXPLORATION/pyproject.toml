[project]
name = "midi-exploration"
version = "0.0.0"
description = "Visualization and validation UI for analyzed MIDI data"
requires-python = "==3.14.*"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.3",
    "plotly==6.9.0",
    "streamlit==1.59.2",
    "pretty_midi==0.2.11",
    "matplotlib==3.11.1",
    "openai==2.48.0",
]

[project.optional-dependencies]
import = [
    "midi_preprocessor",
    "midi_analyzer_tagger",
    "midi_llm_search_engine",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
